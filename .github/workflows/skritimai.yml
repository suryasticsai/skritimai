name: Start Skritimai AI Engine

on:
  workflow_dispatch:
    inputs:
      model:
        description: "Primary model"
        default: "qwen2.5:7b"
        type: string
      fallback_model:
        description: "Fallback model"
        default: "qwen2.5:3b"
        type: string
      extra_models:
        description: "Extra models"
        default: "nomic-embed-text"
        type: string
      num_ctx:
        description: "Context window"
        default: "32768"
        type: string
      draft_tokens:
        description: "MTP draft tokens"
        default: "2"
        type: string
      runtime_minutes:
        description: "Max runtime"
        default: "350"
        type: string

concurrency:
  group: ai-engine
  cancel-in-progress: true

jobs:
  run-kaggle:
    runs-on: ubuntu-latest
    timeout-minutes: 360 
    permissions:
      actions: write
      contents: read
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Launch engine on Kaggle GPU
        uses: KevKibe/kaggle-script-action@v1.0.5
        with:
          username: ${{ secrets.KAGGLE_USERNAME }}
          key: ${{ secrets.KAGGLE_KEY }}
          title: "Skritimai-Backend"
          enable_gpu: true
          enable_internet: true
          sleep_time: 30
          custom_script: |
            import os
            
            os.environ["GITHUB_TOKEN"] = "${{ secrets.GITHUB_TOKEN }}"
            os.environ["GITHUB_REPO"] = "${{ github.repository }}"
            
            !git clone https://github.com/suryasticsai/skritimai.git /kaggle/working/skritimai
            
            !cd /kaggle/working/skritimai && python run_engine.py "${{ inputs.model }}" "${{ inputs.fallback_model }}" "${{ inputs.extra_models }}" "${{ inputs.num_ctx }}" "${{ inputs.draft_tokens }}" "${{ inputs.runtime_minutes }}" "${{ secrets.ENGINE_API_KEY }}"