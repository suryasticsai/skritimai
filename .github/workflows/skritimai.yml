name: Start Skritimai AI Engine

on:
  workflow_dispatch:
    inputs:
      model:
        description: "Primary model (Ollama name or huggingface.co/... GGUF)"
        default: "qwen2.5:7b"
        type: string
      fallback_model:
        description: "Fallback model (used if VRAM < 28GB)"
        default: "qwen2.5:3b"
        type: string
      extra_models:
        description: "Extra models, comma separated"
        default: "nomic-embed-text"
        type: string
      num_ctx:
        description: "Context window in tokens"
        default: "32768"
        type: string
      draft_tokens:
        description: "MTP / draft_num_predict value"
        default: "2"
        type: string
      runtime_minutes:
        description: "How long to keep the engine alive (max ~360)"
        default: "350"
        type: string

concurrency:
  group: ai-engine
  cancel-in-progress: true

jobs:
  run-kaggle:
    runs-on: ubuntu-latest
    timeout-minutes: 360 
    
    # 🔑 CRITICAL: This allows Kaggle to update your GitHub repository variable!
    permissions:
      actions: write
      contents: read
      id-token: write

    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: 📋 Print Configuration
        run: |
          echo "🤖 Booting Skritimai with the following config:"
          echo "Primary Model: ${{ inputs.model }}"
          echo "Context Window: ${{ inputs.num_ctx }}"
          echo "Runtime: ${{ inputs.runtime_minutes }} minutes"

      - name: 🚀 Launch Engine on Kaggle GPU
        uses: KevKibe/kaggle-script-action@v1.0.5
        with:
          username: ${{ secrets.KAGGLE_USERNAME }}
          key: ${{ secrets.KAGGLE_KEY }}
          title: "Skritimai-Backend"
          enable_gpu: true
          enable_internet: true
          sleep_time: 30
          custom_script: |
            import os
            
            print("🔐 Setting up environment variables...")
            # Pass the GITHUB_TOKEN securely so the script can update the variable
            os.environ["GITHUB_TOKEN"] = "${{ secrets.GITHUB_TOKEN }}"
            os.environ["GITHUB_REPO"] = "${{ github.repository }}"
            
            print("📦 Cloning Skritimai repository...")
            !git clone https://github.com/suryasticsai/skritimai.git /kaggle/working/skritimai
            
            print("🔥 Starting the AI Engine...")
            !cd /kaggle/working/skritimai && python run_engine.py "${{ inputs.model }}" "${{ inputs.fallback_model }}" "${{ inputs.extra_models }}" "${{ inputs.num_ctx }}" "${{ inputs.draft_tokens }}" "${{ inputs.runtime_minutes }}" "${{ secrets.ENGINE_API_KEY }}" "${{ secrets.ENGINE_GIST_ID }}" "${{ secrets.ENGINE_GIST_TOKEN }}"