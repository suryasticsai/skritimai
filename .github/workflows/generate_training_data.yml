name: Generate DPO Training Data

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-data:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Node dependencies
        run: |
          cd training
          npm install

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Python dependencies
        run: pip install requests

      - name: Run Data Generation Script
        env:
          SKRITIMAI_KEY: ${{ secrets.ENGINE_API_KEY }}
          SKRITIMAI_URL: "https://skritimai.varakala-saisurya.workers.dev/v1/chat/completions"
        run: |
          cd training
          python mutate_eval.py

      - name: Commit and Push Training Data
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "🤖 Auto-generated DPO training data"
          file_pattern: 'training/dpo_training_data.jsonl'