name: Generate DPO Training Data (Self-Evolving)

on:
  workflow_dispatch: 
  schedule:
    - cron: '0 0 * * *' # Runs automatically every day at midnight

permissions:
  contents: write

jobs:
  generate-data:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Node dependencies
        run: |
          cd training
          npm install

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Python dependencies
        run: pip install requests

      - name: 🔍 Scrape Public Repositories
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          cd training
          python scrape_repos.py

      - name: 🧠 Generate Training Data
        env:
          SKRITIMAI_KEY: ${{ secrets.ENGINE_API_KEY }}
          SKRITIMAI_URL: "https://skritimai.varakala-saisurya.workers.dev/v1/chat/completions"
        run: |
          cd training
          python mutate_eval.py

      - name: Commit and Push Updates
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "🤖 Auto-evolved: Added new HTML files and generated training data"
          file_pattern: 'training/clean_html/*.html training/dpo_training_data.jsonl'